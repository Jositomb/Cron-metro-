<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eee5d7">
<title>Actualizar Mi Presidencia</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#eee5d7;color:#293b38;
    font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:24px;box-sizing:border-box}
  main{max-width:460px;width:100%;background:#f8f1e5;border:1px solid #c8bea9;border-radius:20px;padding:26px;box-shadow:0 18px 50px #59482b26}
  h1{margin:0 0 10px;font-family:"New York",ui-serif,Georgia,serif;font-size:26px}
  p{line-height:1.5;margin:8px 0}
  #estado{font-weight:600;color:#28666c;min-height:1.5em}
  .seguro{font-size:14px;color:#5a6256}
  a.boton{display:block;margin-top:18px;text-align:center;padding:14px;border-radius:26px;background:#28666c;color:#fff;text-decoration:none;font-weight:700;font-size:17px}
  a.boton[aria-disabled=true]{opacity:.45;pointer-events:none}
</style>
</head>
<body>
<main>
  <h1>Actualizar Mi Presidencia</h1>
  <p id="estado">Preparando…</p>
  <p class="seguro">Solo se borra la copia guardada para usar la app sin conexión. Tus reuniones, nombres, notas, trazos e historial se conservan.</p>
  <a class="boton" id="abrir" href="index.html" aria-disabled="true">Abrir la app actualizada</a>
</main>
<script>
'use strict';
(async()=>{
  const estado=document.getElementById('estado'),abrir=document.getElementById('abrir');
  const listo=texto=>{estado.textContent=texto;abrir.href='index.html?actualizada='+Date.now();abrir.setAttribute('aria-disabled','false')};
  try{
    let corriendo=false;
    try{
      for(const k of ['cronometro-reunion-v1','cronometro-weekend-v1']){
        const s=JSON.parse(localStorage.getItem(k)||'null');
        if(s&&(s.total?.started!=null||s.parts?.some?.(p=>p.started!=null)||s.talk?.started!=null||s.watchtower?.started!=null))corriendo=true;
      }
    }catch(e){}
    if(corriendo&&!confirm('Hay un cronómetro en marcha. Los tiempos se conservan, pero conviene actualizar al terminar la reunión. ¿Actualizar ahora?')){
      estado.textContent='Actualización cancelada. Vuelve cuando termine la reunión.';
      abrir.textContent='Volver a la app';abrir.setAttribute('aria-disabled','false');return;
    }
    estado.textContent='Quitando la versión antigua…';
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in self){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('cronometro-reunion-v')).map(k=>caches.delete(k)));
    }
    let version='';
    try{const r=await fetch('version.json?comprobar='+Date.now(),{cache:'no-store'});version=(await r.json()).version}catch(e){}
    listo(version?'Listo. Se abrirá la versión '+version+'.':'Listo. Abre la app con conexión a internet.');
  }catch(e){
    listo('No se pudo completar del todo. Cierra la pestaña y vuelve a abrir la app.');
  }
})();
</script>
</body>
</html>

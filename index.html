<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10283c"><meta name="apple-mobile-web-app-capable" content="yes"><title>Cronómetro de reunión</title><link rel="stylesheet" href="style.css?v=4"></head>
